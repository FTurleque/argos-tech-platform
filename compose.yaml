# ARGOS — même assemblage sur le PC (Docker Desktop) et sur le Synology (Container Manager).
# ADR-0017 (POC local) et ADR-0026 (Synology).
#
#   docker compose up -d postgres     # développement : base seule, pour « mvn quarkus:dev »
#   docker compose up -d --build      # Argos complet : http://localhost:8080
#                                     (fournisseur d'identité requis : profil « idp-local » ou Keycloak existant)
#   docker compose --profile ia up -d # Argos avec le modèle local Ollama (facultatif, ADR-0029)
#   docker compose exec ollama ollama pull qwen2.5:1.5b   # une fois : télécharge le modèle par défaut
#
# Réglages dans un fichier .env à côté de ce fichier (modèle : .env.example). Les quatre mots de passe de base
# (administration, propriétaire et connexion d'Argos, Keycloak) sont obligatoires : sans eux, Compose refuse de démarrer.
# Toute variable lue par le serveur en production est transmise au service argos et figure dans .env.example
# (EXP-07, contrôlé par scripts/verifier-configuration.mjs) ; chaque défaut repris ici est celui de
# application.properties, sauf mention contraire.
# Dimensionnement par défaut pour le DS1522+ (8 Go) : plafonds cumulés de 4,75 Gio avec les profils « ia » et
# « idp-local », pools de connexions sous max_connections (EXP-11, docs/deploiement/synology-et-pc.md).
name: argos

# Journaux de conteneur bornés par rotation (EXP-09) : trois fichiers de 10 Mio au plus par service.
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Durcissement commun à tous les services (EXP-12, EXP-16) : système de fichiers racine en lecture seule, aucune
# capacité système, aucune élévation de privilèges. Chaque service déclare en plus ses seuls emplacements
# inscriptibles : volumes de données et tmpfs (vidés à chaque redémarrage).
x-durcissement: &durcissement
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *durcissement
    image: postgres:18
    restart: unless-stopped
    # Exécuté directement sous l'utilisateur postgres de l'image (999), propriétaire des fichiers du volume : le
    # point d'entrée n'a alors besoin d'aucune capacité (EXP-16). Inscriptibles : le volume, /tmp et le socket.
    user: postgres
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # Réglages pour le plafond mémoire du service (EXP-11) : max_connections au-dessus de la somme des pools
    # d'Argos et de Keycloak, avec une marge pour les migrations, l'administration et la sauvegarde.
    command:
      - postgres
      - -c
      - max_connections=${ARGOS_DB_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${ARGOS_DB_SHARED_BUFFERS:-128MB}
      - -c
      - work_mem=${ARGOS_DB_WORK_MEM:-4MB}
    environment:
      POSTGRES_DB: ${ARGOS_DB_NAME:-argos}
      # Superutilisateur d'administration : initialisation, sauvegarde et restauration seulement (ADR-0035).
      POSTGRES_USER: ${ARGOS_DB_ADMIN_USER:-argos_admin}
      POSTGRES_PASSWORD: ${ARGOS_DB_ADMIN_PASSWORD:?ARGOS_DB_ADMIN_PASSWORD obligatoire (voir .env.example)}
      # Rôles créés par deploiement/postgres/initialiser-bases.sh au premier démarrage du volume.
      ARGOS_DB_OWNER: &proprietaire ${ARGOS_DB_OWNER:-argos}
      ARGOS_DB_OWNER_PASSWORD: &proprietaire-mdp ${ARGOS_DB_OWNER_PASSWORD:?ARGOS_DB_OWNER_PASSWORD obligatoire (voir .env.example)}
      ARGOS_DB_USER: &connexion ${ARGOS_DB_USER:-argos_connexion}
      ARGOS_DB_PASSWORD: &connexion-mdp ${ARGOS_DB_PASSWORD:?ARGOS_DB_PASSWORD obligatoire (voir .env.example)}
      ARGOS_KEYCLOAK_DB_USER: &keycloak ${ARGOS_KEYCLOAK_DB_USER:-keycloak}
      ARGOS_KEYCLOAK_DB_PASSWORD: &keycloak-mdp ${ARGOS_KEYCLOAK_DB_PASSWORD:?ARGOS_KEYCLOAK_DB_PASSWORD obligatoire (voir .env.example)}
    ports:
      # Joignable seulement depuis la machine elle-même (outils de développement).
      - "127.0.0.1:${ARGOS_DB_PORT:-5432}:5432"
    volumes:
      # À partir de PostgreSQL 18, l'image attend le volume sur /var/lib/postgresql.
      - argos-pgdata:/var/lib/postgresql
      # Rôles et bases d'Argos et de Keycloak (profil « idp-local »), créés au premier démarrage du volume.
      - ./deploiement/postgres/initialiser-bases.sh:/docker-entrypoint-initdb.d/initialiser-bases.sh:ro
    mem_limit: ${ARGOS_DB_MEM_LIMIT:-512m}
    logging: *journaux
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fournisseur d'identité Keycloak (ADR-0027) pour un poste sans Keycloak existant : profil « idp-local ».
  # Le royaume « argos » est importé au premier démarrage avec un seul compte, l'administrateur (ARGOS_ADMIN_EMAIL),
  # au mot de passe provisoire ARGOS_ADMIN_MOT_DE_PASSE_INITIAL à changer à la première connexion. Keycloak
  # n'importe pas un royaume qui existe déjà : changer ces variables ensuite ne modifie pas le compte.
  keycloak:
    <<: *durcissement
    # Image optimisée construite localement (deploiement/keycloak/Dockerfile, EXP-16) : l'image officielle
    # reconstruirait Quarkus au démarrage, ce qu'interdit la racine en lecture seule. Reconstruire après tout
    # changement d'ARGOS_KEYCLOAK_VERSION : docker compose --profile idp-local up -d --build.
    build:
      context: ./deploiement/keycloak
      args:
        VERSION_KEYCLOAK: ${ARGOS_KEYCLOAK_VERSION:-26.7.4}
    image: argos-keycloak:${ARGOS_KEYCLOAK_VERSION:-26.7.4}
    profiles: ["idp-local"]
    restart: unless-stopped
    # Inscriptibles : /tmp (Vert.x, téléversements) et /opt/keycloak/data (journal des transactions) ; le royaume
    # reste monté en lecture seule par-dessus. Les données durables sont dans la base keycloak.
    tmpfs:
      - /tmp
      - /opt/keycloak/data:uid=1000,gid=0,mode=0770
    # Garde des variables obligatoires du profil (EXP-08) : sans elles, le conteneur s'arrête avant tout import
    # du royaume, avec un message nommant la variable. Compose interpole aussi les services des profils
    # inactifs : une interpolation ${VAR:?} ici empêcherait de démarrer sans le profil.
    entrypoint:
      - /bin/bash
      - -c
      - |
        manquantes=0
        for couple in ARGOS_ADMIN_EMAIL:ARGOS_ADMIN_EMAIL \
            ARGOS_ADMIN_MOT_DE_PASSE_INITIAL:ARGOS_ADMIN_MOT_DE_PASSE_INITIAL \
            KC_BOOTSTRAP_ADMIN_PASSWORD:ARGOS_KEYCLOAK_ADMIN_MOT_DE_PASSE; do
          interne=$${couple%%:*}
          if [ -z "$${!interne}" ]; then
            echo "Profil idp-local : $${couple#*:} obligatoire (voir .env.example), royaume non importé." >&2
            manquantes=1
          fi
        done
        if [ "$$manquantes" -ne 0 ]; then
          exit 1
        fi
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: *keycloak
      KC_DB_PASSWORD: *keycloak-mdp
      # Pool de connexions de Keycloak, compté dans le budget de max_connections de PostgreSQL (EXP-11).
      KC_DB_POOL_MAX_SIZE: ${ARGOS_KEYCLOAK_DB_POOL_MAX_SIZE:-10}
      KC_HTTP_ENABLED: "true"
      # Adresse vue par le navigateur et dans les jetons (émetteur public) ; les appels d'Argos passent par le
      # réseau du projet. Depuis un autre poste, ARGOS_KEYCLOAK_PUBLIC_URL nomme l'adresse joignable de Keycloak.
      KC_HOSTNAME: ${ARGOS_KEYCLOAK_PUBLIC_URL:-http://localhost:${ARGOS_KEYCLOAK_PORT:-8180}}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ARGOS_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ARGOS_KEYCLOAK_ADMIN_MOT_DE_PASSE:-}
      ARGOS_ADMIN_EMAIL: ${ARGOS_ADMIN_EMAIL:-}
      ARGOS_ADMIN_MOT_DE_PASSE_INITIAL: ${ARGOS_ADMIN_MOT_DE_PASSE_INITIAL:-}
      # Adresse publique d'Argos, substituée à l'import du royaume dans les adresses de retour, les origines et
      # les adresses de fin de session du client argos-ui (sans joker).
      ARGOS_PUBLIC_URL: ${ARGOS_PUBLIC_URL:-http://localhost:${ARGOS_PORT:-8080}}
    volumes:
      - ./deploiement/keycloak/argos-realm.json:/opt/keycloak/data/import/argos-realm.json:ro
    ports:
      # 127.0.0.1 par défaut : le royaume livré est durci (force brute, politique de mot de passe, TLS exigé hors
      # réseau privé) avant toute ouverture ; ARGOS_KEYCLOAK_BIND=0.0.0.0 pour l'atteindre depuis un autre poste.
      - "${ARGOS_KEYCLOAK_BIND:-127.0.0.1}:${ARGOS_KEYCLOAK_PORT:-8180}:8080"
    mem_limit: ${ARGOS_KEYCLOAK_MEM_LIMIT:-768m}
    logging: *journaux
    healthcheck:
      test:
        - CMD-SHELL
        - |
          set -e
          exec 3<>/dev/tcp/localhost/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  argos:
    build: .
    image: argos:${ARGOS_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
        required: false
    # Chaque variable reprend le défaut de production d'application.properties : une variable transmise vide ne
    # retombe pas sur le défaut « ${NOM:défaut} » de SmallRye Config.
    environment:
      ARGOS_DB_URL: ${ARGOS_DB_URL:-jdbc:postgresql://postgres:5432/${ARGOS_DB_NAME:-argos}}
      # Connexion de l'application (ni superutilisateur, ni propriétaire, soumise à la RLS) ; migrations appliquées
      # au démarrage sous le propriétaire de la base (EXP-05).
      ARGOS_DB_USER: *connexion
      ARGOS_DB_PASSWORD: *connexion-mdp
      ARGOS_DB_OWNER: *proprietaire
      ARGOS_DB_OWNER_PASSWORD: *proprietaire-mdp
      # Pool de connexions d'Argos, compté dans le budget de max_connections de PostgreSQL (EXP-11).
      ARGOS_DB_POOL_MAX_SIZE: ${ARGOS_DB_POOL_MAX_SIZE:-10}
      # Fournisseur d'identité OIDC (Keycloak, ADR-0027) : obligatoire, Argos refuse de démarrer sans.
      ARGOS_OIDC_URL: ${ARGOS_OIDC_URL:-}
      # Émetteur public : adresse du royaume que joint le navigateur et que portent les jetons. L'IHM le lit au
      # démarrage et la politique de sécurité du contenu le nomme. Sans valeur, c'est ARGOS_OIDC_URL ; avec le
      # profil idp-local, ARGOS_OIDC_URL est l'adresse interne et l'émetteur public celle de Keycloak.
      ARGOS_OIDC_ISSUER_PUBLIC: ${ARGOS_OIDC_ISSUER_PUBLIC:-${ARGOS_OIDC_URL:-}}
      ARGOS_OIDC_CLIENT_ID: ${ARGOS_OIDC_CLIENT_ID:-argos-server}
      ARGOS_OIDC_AUDIENCE: ${ARGOS_OIDC_AUDIENCE:-argos-server}
      ARGOS_ADMIN_EMAIL: ${ARGOS_ADMIN_EMAIL:-}
      # Adresse publique d'Argos, début des liens des e-mails. Défaut : l'IHM servie par ce conteneur
      # (application.properties vise l'IHM de développement).
      ARGOS_PUBLIC_URL: ${ARGOS_PUBLIC_URL:-http://localhost:${ARGOS_PORT:-8080}}
      # E-mails : relais SMTP (celui de DSM sur le NAS) ; mot de passe dans .env seulement.
      ARGOS_MAIL_FROM: ${ARGOS_MAIL_FROM:-argos@localhost}
      ARGOS_SMTP_HOST: ${ARGOS_SMTP_HOST:-localhost}
      ARGOS_SMTP_PORT: ${ARGOS_SMTP_PORT:-587}
      ARGOS_SMTP_STARTTLS: ${ARGOS_SMTP_STARTTLS:-REQUIRED}
      ARGOS_SMTP_TIMEOUT: ${ARGOS_SMTP_TIMEOUT:-PT10S}
      ARGOS_SMTP_USER: ${ARGOS_SMTP_USER:-}
      ARGOS_SMTP_PASSWORD: ${ARGOS_SMTP_PASSWORD:-}
      # Forges : jetons en lecture seule, facultatifs.
      ARGOS_GITLAB_TOKEN: ${ARGOS_GITLAB_TOKEN:-}
      ARGOS_GITHUB_TOKEN: ${ARGOS_GITHUB_TOKEN:-}
      # Planifications (expressions cron au fuseau ARGOS_ALERTES_FUSEAU ; « off » désactive la tâche).
      ARGOS_ALERTES_FUSEAU: ${ARGOS_ALERTES_FUSEAU:-Europe/Paris}
      ARGOS_INGESTION_PLANIFICATION_CADENCE: ${ARGOS_INGESTION_PLANIFICATION_CADENCE:-1h}
      ARGOS_INVENTORY_IMPORT_CRON: ${ARGOS_INVENTORY_IMPORT_CRON:-0 0 3 * * ?}
      ARGOS_RESUME_QUOTIDIEN_CRON: ${ARGOS_RESUME_QUOTIDIEN_CRON:-0 0 8 * * ?}
      ARGOS_RESUME_HEBDOMADAIRE_CRON: ${ARGOS_RESUME_HEBDOMADAIRE_CRON:-0 0 8 ? * MON}
      ARGOS_RADAR_CRON: ${ARGOS_RADAR_CRON:-0 0 6 * * ?}
      ARGOS_ACTIVITE_PURGE_CRON: ${ARGOS_ACTIVITE_PURGE_CRON:-0 30 4 * * ?}
      ARGOS_CONSERVATION_CRON: ${ARGOS_CONSERVATION_CRON:-0 45 4 * * ?}
      ARGOS_ARTISTE_COLLECTE_CRON: ${ARGOS_ARTISTE_COLLECTE_CRON:-0 0 5 * * ?}
      ARGOS_ARTISTE_RAPPELS_CRON: ${ARGOS_ARTISTE_RAPPELS_CRON:-0 0 7 * * ?}
      ARGOS_REGLEMENTAIRE_COLLECTE_CRON: ${ARGOS_REGLEMENTAIRE_COLLECTE_CRON:-0 30 6 * * ?}
      ARGOS_REGLEMENTAIRE_RAPPELS_CRON: ${ARGOS_REGLEMENTAIRE_RAPPELS_CRON:-0 15 7 * * ?}
      ARGOS_JORF_URL: ${ARGOS_JORF_URL:-https://echanges.dila.gouv.fr/OPENDATA/JORF}
      # Passerelle IA (encadrer-appels-ia) : facultative et désactivée par défaut. Avec le profil « ia »,
      # ARGOS_IA_ACTIVE à true l'active ; sans IA, Argos fonctionne en mode déterministe. L'adresse vise par
      # défaut le service ollama du projet.
      ARGOS_IA_ACTIVE: ${ARGOS_IA_ACTIVE:-false}
      ARGOS_OLLAMA_URL: ${ARGOS_OLLAMA_URL:-http://ollama:11434}
      ARGOS_IA_MODELE: ${ARGOS_IA_MODELE:-qwen2.5:1.5b}
      ARGOS_IA_DELAI: ${ARGOS_IA_DELAI:-PT60S}
      ARGOS_IA_PLAFOND_JOUR: ${ARGOS_IA_PLAFOND_JOUR:-1000}
      ARGOS_IA_QUOTA_ESPACE_JOUR: ${ARGOS_IA_QUOTA_ESPACE_JOUR:-100}
      ARGOS_IA_QUOTA_COMPTE_JOUR: ${ARGOS_IA_QUOTA_COMPTE_JOUR:-20}
      ARGOS_IA_ANALYSE_CORRELATION: ${ARGOS_IA_ANALYSE_CORRELATION:-false}
      TZ: ${TZ:-Europe/Paris}
    ports:
      # 127.0.0.1 par défaut : accès local, ou via le reverse proxy de DSM sur le NAS.
      # ARGOS_BIND=0.0.0.0 pour un accès direct depuis le réseau local ou le VPN.
      - "${ARGOS_BIND:-127.0.0.1}:${ARGOS_PORT:-8080}:8080"
    mem_limit: ${ARGOS_MEM_LIMIT:-1g}
    logging: *journaux
    # Contrôle de santé : HEALTHCHECK de l'image (Dockerfile), sur /q/health/ready.
    # Durcissement (EXP-12, fragment x-durcissement) : seul /tmp est inscriptible (fichiers temporaires de la JVM
    # et de Vert.x).
    <<: *durcissement
    tmpfs:
      - /tmp

  # Modèle d'IA local (image officielle ollama/ollama, licence MIT), désactivé par défaut : il ne
  # démarre qu'avec le profil « ia ». Aucun port publié : seul Argos l'appelle, par le réseau du
  # projet. qwen2.5:1.5b tient dans environ 2 Gio sur le processeur du DS1522+ (pas de GPU) ; un
  # modèle plus gros dépasse vite la mémoire du NAS (ADR-0029) et demande de relever ARGOS_OLLAMA_MEM_LIMIT.
  ollama:
    <<: *durcissement
    image: ollama/ollama:${ARGOS_OLLAMA_VERSION:-0.40.18}
    profiles: ["ia"]
    restart: unless-stopped
    # Utilisateur root de l'image, sans capacité (EXP-16) : il n'écrit que dans son volume, qui lui appartient,
    # et dans /tmp (détection des processeurs graphiques au démarrage).
    tmpfs:
      - /tmp
    environment:
      # Un seul modèle chargé et une requête à la fois : borne la mémoire et le processeur du NAS.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: ${ARGOS_OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - argos-ollama:/root/.ollama
    mem_limit: ${ARGOS_OLLAMA_MEM_LIMIT:-2560m}
    logging: *journaux
    # Sain quand le serveur local répond (la commande interroge son API).
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  argos-pgdata:
  argos-ollama:
