# ---------------------------------------------------------------------------
# ARGOS — configuration du serveur
# Les secrets ne sont jamais versionnés : ils viennent de variables d'environnement.
# ---------------------------------------------------------------------------
quarkus.application.name=argos-server

# --- Base de données (ADR-0002) ---------------------------------------------
quarkus.datasource.db-kind=postgresql
# Production / VM : tout vient de l'environnement.
%prod.quarkus.datasource.jdbc.url=${ARGOS_DB_URL}
%prod.quarkus.datasource.username=${ARGOS_DB_USER}
%prod.quarkus.datasource.password=${ARGOS_DB_PASSWORD}
# Développement : la base PostgreSQL de compose.yaml (docker compose up -d postgres).
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/argos
%dev.quarkus.datasource.username=argos
%dev.quarkus.datasource.password=argos
# Tests : Quarkus Dev Services démarre un PostgreSQL jetable (Docker requis) ;
# port HTTP de test aléatoire pour permettre plusieurs exécutions en parallèle.
%test.quarkus.http.test-port=0

# --- Migrations (Flyway : choix provisoire, ADR à rédiger, arc42 §9.3 point 3) ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# --- Chaîne sécurité (changement formaliser-chaine-securite-poc) ------------
# Sources publiques et gratuites ; aucun jeton n'est requis pour OSV, KEV, EPSS et CERT-FR.
argos.sources.http-timeout=PT30S
argos.sources.osv.export-url=https://osv-vulnerabilities.storage.googleapis.com
argos.sources.osv.api-url=https://api.osv.dev
argos.sources.osv.ecosystems=Maven,npm,PyPI
argos.sources.nvd.url=https://services.nvd.nist.gov/rest/json/cves/2.0
argos.sources.kev.url=https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
argos.sources.epss.url=https://api.first.org/data/v1/epss
argos.sources.certfr.feed-url=https://www.cert.cyber.gouv.fr/avis/feed/
argos.sources.certfr.base-url=https://www.cert.cyber.gouv.fr/avis/
# Nouvelles tentatives et état DEGRADED : décision du 2026-11-16 (Q-4).
argos.ingestion.max-attempts=5
argos.ingestion.backoff-initial=PT2S
argos.ingestion.backoff-max=PT5M
argos.ingestion.degraded-threshold=3
# Durée après laquelle une synchronisation RUNNING sans activité est reprise (paramètre d'exploitation).
argos.ingestion.running-expiry=PT30M
# SBOM obsolète 30 jours après sa génération : décision du 2026-11-16 (Q-3).
argos.inventory.sbom-max-age=P30D
# Taille maximale d'une SBOM ou d'un manifeste (paramètre de sécurité, 20 Mio).
argos.inventory.max-document-bytes=20971520
# Forges : jetons facultatifs, fournis par l'environnement (jamais versionnés).
argos.scm.gitlab.url=https://gitlab.com
argos.scm.github.url=https://api.github.com
argos.scm.gitlab.token=${ARGOS_GITLAB_TOKEN:}
argos.scm.github.token=${ARGOS_GITHUB_TOKEN:}

# --- API --------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=ARGOS API
quarkus.smallrye-openapi.info-version=v1
quarkus.swagger-ui.always-include=false

# --- CORS : IHM Vite en développement et client desktop Electron (ADR-0022) --
# Le desktop sert l'IHM depuis son protocole interne app://argos.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=app://argos
%dev.quarkus.http.cors.origins=http://localhost:5173,app://argos
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
