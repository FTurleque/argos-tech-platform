# ---------------------------------------------------------------------------
# ARGOS — configuration du serveur
# Les secrets ne sont jamais versionnés : ils viennent de variables d'environnement.
# ---------------------------------------------------------------------------
quarkus.application.name=argos-server

# --- Base de données (ADR-0002) ---------------------------------------------
quarkus.datasource.db-kind=postgresql
# Deux comptes (EXP-05, ADR-0035) : l'application se connecte avec le rôle de connexion (ni superutilisateur,
# ni propriétaire, soumis à la RLS) ; Flyway applique les migrations sous le propriétaire de la base.
# Production / VM : tout vient de l'environnement.
%prod.quarkus.datasource.jdbc.url=${ARGOS_DB_URL}
%prod.quarkus.datasource.username=${ARGOS_DB_USER}
%prod.quarkus.datasource.password=${ARGOS_DB_PASSWORD}
%prod.quarkus.flyway.username=${ARGOS_DB_OWNER}
%prod.quarkus.flyway.password=${ARGOS_DB_OWNER_PASSWORD}
# Pool de connexions borné (EXP-11) : compté avec celui de Keycloak sous max_connections de PostgreSQL
# (compose.yaml). Une requête qui attend une connexion libre plus de 5 secondes échoue.
quarkus.datasource.jdbc.max-size=${ARGOS_DB_POOL_MAX_SIZE:10}
quarkus.datasource.jdbc.acquisition-timeout=PT5S
# Développement : la base PostgreSQL de compose.yaml (docker compose up -d postgres), mots de passe du fichier .env
# fournis par l'environnement.
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${ARGOS_DB_PORT:5432}/${ARGOS_DB_NAME:argos}
%dev.quarkus.datasource.username=${ARGOS_DB_USER:argos_connexion}
%dev.quarkus.datasource.password=${ARGOS_DB_PASSWORD}
%dev.quarkus.flyway.username=${ARGOS_DB_OWNER:argos}
%dev.quarkus.flyway.password=${ARGOS_DB_OWNER_PASSWORD}
# Tests : Quarkus Dev Services démarre un PostgreSQL jetable (Docker requis), initialisé par le script de
# l'instance de production (rôles et bases). Cette base jetable accepte toute connexion sans mot de passe
# (authentification « trust ») : aucun mot de passe n'est écrit ici et les rôles sont créés sans.
%test.quarkus.datasource.devservices.db-name=argos
%test.quarkus.datasource.devservices.username=argos_admin
%test.quarkus.datasource.devservices.volumes."../deploiement/postgres/initialiser-bases.sh"=/docker-entrypoint-initdb.d/initialiser-bases.sh
%test.quarkus.datasource.devservices.container-env.POSTGRES_HOST_AUTH_METHOD=trust
%test.quarkus.datasource.devservices.container-env.ARGOS_DB_OWNER=argos
%test.quarkus.datasource.devservices.container-env.ARGOS_DB_USER=argos_connexion
%test.quarkus.datasource.username=argos_connexion
%test.quarkus.flyway.username=argos
# Quarkus n'emploie l'utilisateur Flyway qu'accompagné d'un mot de passe ; la base jetable n'en vérifie aucun,
# la valeur reprise ici n'est pas un secret.
%test.quarkus.flyway.password=${quarkus.flyway.username}
# Port HTTP de test aléatoire pour permettre plusieurs exécutions en parallèle.
%test.quarkus.http.test-port=0

# --- Migrations (Flyway, appliquées au démarrage : ADR-0032, Accepté) --------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# --- Chaîne sécurité (changement formaliser-chaine-securite-poc) ------------
# Sources publiques et gratuites ; aucun jeton n'est requis pour OSV, KEV, EPSS et CERT-FR.
argos.sources.http-timeout=PT30S
argos.sources.osv.export-url=https://osv-vulnerabilities.storage.googleapis.com
argos.sources.osv.api-url=https://api.osv.dev
argos.sources.osv.ecosystems=Maven,npm,PyPI
argos.sources.nvd.url=https://services.nvd.nist.gov/rest/json/cves/2.0
argos.sources.kev.url=https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
argos.sources.epss.url=https://api.first.org/data/v1/epss
argos.sources.certfr.feed-url=https://www.cert.cyber.gouv.fr/avis/feed/
argos.sources.certfr.base-url=https://www.cert.cyber.gouv.fr/avis/
# Nouvelles tentatives et état DEGRADED : décision du 2026-11-16 (Q-4).
argos.ingestion.max-attempts=5
argos.ingestion.backoff-initial=PT2S
argos.ingestion.backoff-max=PT5M
argos.ingestion.degraded-threshold=3
# Durée après laquelle une synchronisation RUNNING sans activité est reprise (paramètre d'exploitation).
argos.ingestion.running-expiry=PT30M
# Synchronisation planifiée de chaque source d'avis, toutes les heures par défaut (décision J1 du
# 2026-11-19, COL-09 ; ADR-0031). « off » désactive la tâche (pile E2E : aucun appel à Internet).
argos.ingestion.planification.cadence=${ARGOS_INGESTION_PLANIFICATION_CADENCE:1h}
# SBOM obsolète 30 jours après sa génération : décision du 2026-11-16 (Q-3).
argos.inventory.sbom-max-age=P30D
# Taille maximale d'une SBOM ou d'un manifeste (paramètre de sécurité, 20 Mio).
argos.inventory.max-document-bytes=20971520
# Corps HTTP admis au-dessus de cette taille, pour que l'import manuel d'un document trop grand soit refusé avec
# son motif (INV-13-S3) ; au-delà, le serveur HTTP répond 413.
quarkus.http.limits.max-body-size=24M
# Import planifié des inventaires depuis les dépôts configurés (automatiser-chaine-veille, INV-07 ; décision J3
# du porteur du projet, 2026-11-19) : chaque jour à 03:00, au fuseau argos.alerting.fuseau ; « off » le désactive
# (pile E2E). Aucun webhook : l'import n'est déclenché que par cette tâche ou par un import manuel.
argos.inventory.import.cron=${ARGOS_INVENTORY_IMPORT_CRON:0 0 3 * * ?}
# Relance des enrichissements manquants des signaux à CVE (COL-04-S3) : toutes les heures à la 20e minute, par lots
# de 100 signaux ; « off » la désactive.
argos.vulnintel.relance.cron=${ARGOS_ENRICHISSEMENT_RELANCE_CRON:0 20 * * * ?}
argos.vulnintel.relance.limite=100
# Forges : jetons facultatifs, fournis par l'environnement (jamais versionnés).
argos.scm.gitlab.url=https://gitlab.com
argos.scm.github.url=https://api.github.com
argos.scm.gitlab.token=${ARGOS_GITLAB_TOKEN:}
argos.scm.github.token=${ARGOS_GITHUB_TOKEN:}

# --- Alertes et résumés (changement diffuser-alertes-et-digests) -------------
# Lien vers l'élément dans les messages : adresse publique de l'IHM.
argos.alerting.lien-base=${ARGOS_PUBLIC_URL:http://localhost:5173}
# Résumés quotidien (08:00) et hebdomadaire (lundi 08:00), Europe/Paris : décision du 2026-11-16 (Q-3).
argos.alerting.fuseau=${ARGOS_ALERTES_FUSEAU:Europe/Paris}
argos.alerting.resume-quotidien.cron=${ARGOS_RESUME_QUOTIDIEN_CRON:0 0 8 * * ?}
argos.alerting.resume-hebdomadaire.cron=${ARGOS_RESUME_HEBDOMADAIRE_CRON:0 0 8 ? * MON}
# Diffusion des messages en attente et nouvelles tentatives bornées (ALR-06-S2).
argos.alerting.envoi.intervalle=1m
argos.alerting.envoi.tentatives-max=5
argos.alerting.envoi.delai-initial=PT1M
argos.alerting.envoi.delai-max=PT30M
# Délai maximal d'attente du résumé IA : au-delà, l'alerte part sans résumé (ALR-05).
argos.alerting.resume-ia.delai-max=PT10S
%test.argos.alerting.resume-ia.delai-max=PT1S
# Exécuteur des résumés IA (bean ExecuteurResumeIa, arrêté avec l'application) : fils permanents, fils au plus,
# demandes en file ; au-delà, le résumé est indisponible.
argos.alerting.resume-ia.fils=2
argos.alerting.resume-ia.fils-max=2
argos.alerting.resume-ia.file=16
# Relais SMTP du Synology (DSM) : décision du 2026-11-16 (Q-1). Tout vient de l'environnement ;
# le mot de passe n'est jamais versionné.
quarkus.mailer.from=${ARGOS_MAIL_FROM:argos@localhost}
quarkus.mailer.host=${ARGOS_SMTP_HOST:localhost}
quarkus.mailer.port=${ARGOS_SMTP_PORT:587}
# STARTTLS exigé par défaut : les identifiants SMTP ne circulent jamais en clair.
quarkus.mailer.start-tls=${ARGOS_SMTP_STARTTLS:REQUIRED}
# Durée maximale d'un envoi (connexion et dialogue SMTP) : au-delà, la tentative échoue et est comptée.
quarkus.mailer.timeout=${ARGOS_SMTP_TIMEOUT:PT10S}
quarkus.mailer.username=${ARGOS_SMTP_USER:}
quarkus.mailer.password=${ARGOS_SMTP_PASSWORD:}
%prod.quarkus.mailer.mock=false
# Développement et tests : boîte aux lettres simulée de Quarkus, aucun e-mail réel.
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
# Tests : aucune tâche planifiée ; les tests appellent les traitements avec une horloge simulée.
%test.quarkus.scheduler.enabled=false

# --- Veille RSS/Atom et pages surveillées (collecter-veille-rss-web, ADR-0028) ---
# Collecteur intégré au serveur (Q-1). Chaque source est collectée toutes les heures (Q-2) ;
# le planificateur cherche les sources échues à chaque cadence.
argos.veille-web.frequence=PT1H
argos.veille-web.cadence=5m
argos.veille-web.planification-active=true
%test.argos.veille-web.planification-active=false
# 50 sources personnelles par utilisateur au plus (Q-3).
argos.veille-web.sources-personnelles-max=50
# Bornes de chaque récupération (R-12) : durée totale, redirections suivies, taille du contenu.
argos.veille-web.delai=PT10S
argos.veille-web.redirections-max=5
argos.veille-web.taille-max-octets=2097152
# Fils de la minuterie qui coupe la lecture d'une réponse au-delà du délai (bean MinuterieCoupure).
argos.veille-web.minuterie.fils=1
# Ports autorisés pour une adresse de source et pour chaque redirection.
argos.veille-web.ports-autorises=80,443
# Éléments d'un flux enregistrés par collecte. Un passage du planificateur collecte au plus
# sources-par-passage sources et n'en commence plus après duree-max-passage (inférieure à la cadence).
argos.veille-web.elements-max=100
argos.veille-web.sources-par-passage=200
argos.veille-web.duree-max-passage=PT4M
# Requêtes déclenchant une récupération externe (ajout d'une source, collecte à la demande) :
# 10 par minute et par compte. Tests : limite relevée, vérifiée par un profil de test dédié.
argos.veille-web.debit.requetes-par-minute=10
%test.argos.veille-web.debit.requetes-par-minute=100000
# Couples hôte:port exemptés du refus des réseaux privés et locaux : développement et tests
# seulement (sources simulées sur la boucle locale). Vide en exploitation.
# argos.veille-web.exceptions=

# --- Recherche et vues enregistrées (rechercher-et-filtrer, ADR-0015) ----------
# Recherche plein texte PostgreSQL (configurations french et english, Q-1), sans moteur externe.
# Nombre maximal de vues enregistrées par utilisateur (borne de stockage).
argos.recherche.vues-max=100

# --- Référentiel des standards et radar des sorties (construire-radar-et-standards) ---
# Calendrier : API publique et gratuite endoflife.date, seule source (Q-2). Aucun jeton requis.
argos.radar.endoflife.url=https://endoflife.date
argos.radar.endoflife.delai=PT10S
argos.radar.endoflife.taille-max-octets=1048576
# Tâche quotidienne du radar (synchronisation, dette de version, rappels), fuseau argos.alerting.fuseau.
# Les jours de rappel (J-30, J-7, J0 par défaut, Q-1) se règlent par espace dans l'API.
argos.radar.tache.cron=${ARGOS_RADAR_CRON:0 0 6 * * ?}

# --- Passerelle IA (encadrer-appels-ia, ADR-0004 ; remplacement par ADR-0029 proposé) ---
# Fournisseur local Ollama (MIT), sans clé ni coût (Q-1). L'IA est facultative et désactivée par défaut,
# comme le service ollama de compose.yaml (profil « ia ») : ARGOS_IA_ACTIVE=true l'active. Sans Ollama
# joignable, chaque demande est refusée comme indisponible, sa réservation de quota est rendue et Argos
# poursuit en mode déterministe.
argos.ia.active=${ARGOS_IA_ACTIVE:false}
%test.argos.ia.active=true
argos.ia.ollama.url=${ARGOS_OLLAMA_URL:http://localhost:11434}
# Modèle par défaut de toutes les tâches (Q-3), remplaçable par tâche : argos.ia.modeles.<tâche>=<modèle>
# (tâches : resume-alerte, resume-actualite, analyse-correlation, fiche-reglementaire, domaine-reglementaire).
argos.ia.modele=${ARGOS_IA_MODELE:qwen2.5:1.5b}
# Durée maximale d'un appel au modèle (petits modèles sur le processeur du NAS).
argos.ia.delai=${ARGOS_IA_DELAI:PT60S}
# Plafond de charge : 1 000 appels par jour pour l'instance (Q-1), 100 par jour et par espace (Q-2).
argos.ia.plafond-instance-jour=${ARGOS_IA_PLAFOND_JOUR:1000}
argos.ia.quota-espace-jour=${ARGOS_IA_QUOTA_ESPACE_JOUR:100}
# Quota journalier par compte des demandes explicites d'un utilisateur (résumé IA d'une actualité).
argos.ia.quota-compte-jour=${ARGOS_IA_QUOTA_COMPTE_JOUR:20}
# Résumés IA d'actualités gardés en mémoire (par actualité, contenu, version de prompt et modèle).
argos.ia.cache-actualites.taille=500
argos.ia.cache-actualites.duree=PT24H
# Le jour des compteurs suit le fuseau commun d'Argos.
argos.ia.fuseau=${argos.alerting.fuseau}
# Longueur maximale de chaque entrée transmise au modèle (caractères) ; au-delà, elle est tronquée.
argos.ia.taille-max-entree=8000
# Analyse complémentaire de la corrélation (suggestions de projets, noms de projets INTERNAL transmis) :
# désactivée par défaut, à activer explicitement par l'exploitant.
argos.ia.analyse-correlation.active=${ARGOS_IA_ANALYSE_CORRELATION:false}
# Tests : modèle remplacé pour une tâche, vérifié par PasserelleIaTest (API Ollama simulée par StubServer).
%test.argos.ia.modeles.fiche-reglementaire=qwen2.5:0.5b

# --- Activité des projets (mesurer-activite-projets) ----------------------------
# GitHub et GitLab dès la première version, par les forges et jetons argos.scm.* (Q-1). Jetons en
# lecture seule : GitLab « read_api », GitHub jeton à granularité fine en lecture seule.
# Le planificateur cherche les projets échus à chaque cadence ; chacun est collecté une fois par
# fréquence sur une fenêtre glissante de fenetre-jours jours, jours au fuseau argos.alerting.fuseau.
argos.activite.cadence=1h
argos.activite.frequence=PT24H
argos.activite.fenetre-jours=30
# Nouvelle tentative après une erreur de forge (hors quota : la forge annonce alors sa reprise).
argos.activite.delai-apres-echec=PT1H
# Historique conservé 13 mois puis supprimé chaque jour à 04:30 (Q-2).
argos.activite.conservation-mois=13
argos.activite.purge.cron=${ARGOS_ACTIVITE_PURGE_CRON:0 30 4 * * ?}
# Bornes de lecture d'une forge : pages de 100 éléments par liste, jalons comptés, taille d'une réponse.
argos.scm.activite.pages-max=10
argos.scm.activite.jalons-max=50
argos.scm.activite.taille-max-octets=5242880
# Synthèse IA : délai maximal d'attente et demandes par minute et par compte.
argos.activite.synthese.delai-max=PT20S
%test.argos.activite.synthese.delai-max=PT1S
# Exécuteur des synthèses IA d'activité (bean ExecuteurSyntheseIa, arrêté avec l'application).
argos.activite.synthese.fils=1
argos.activite.synthese.fils-max=2
argos.activite.synthese.file=8
argos.activite.synthese.debit.requetes-par-minute=10
%test.argos.activite.synthese.debit.requetes-par-minute=100000

# --- Observabilité (instrumenter-observabilite, ADR-0036) ----------------------
# Journaux : une ligne JSON par événement en production (EXP-13), avec le MDC (identifiant de corrélation, tâche
# planifiée) et l'exception détaillée (type, message, pile, causes) ; texte en développement et en test.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
# Tout jeton JWT cité dans un message (par exemple un jeton refusé par OIDC) est masqué avant l'écriture (EXP-13-S4).
quarkus.log.console.filter=masquage-jetons
# Métriques Micrometer au format Prometheus sur /q/metrics (chemin par défaut, EXP-14), accès réservé (permission
# « metriques » ci-dessous).
# Métriques techniques : requêtes HTTP, JVM (fournies par l'extension) et pool de connexions de la base.
quarkus.datasource.metrics.enabled=true
# Une tâche planifiée est signalée en retard au-delà de ce nombre d'intervalles de son déclencheur sans exécution
# terminée (EXP-15-S2, décision Q-2 du porteur du projet, 2026-11-24).
argos.observabilite.taches.facteur-retard=2

# --- API --------------------------------------------------------------------
# Réponses compressées (gzip) quand le client l'annonce, IHM comprise (EXP-10).
quarkus.http.enable-compression=true
quarkus.smallrye-openapi.info-title=ARGOS API
quarkus.smallrye-openapi.info-version=v1
quarkus.swagger-ui.always-include=false

# --- Catalogue des profils et des mises en page (ADR-0023, ADR-0024) ----------
# Manifestes publiés : catalog/profils/<identifiant>.json, validés au démarrage.
argos.catalogue.profils.manifestes=developpeur,expert-metier,artiste
# Profils et mises en page retirés du catalogue (listes séparées par des virgules).
# argos.catalogue.profils.retires=
# argos.catalogue.mises-en-page.retirees=
# Profils appliqués à un utilisateur qui n'en a jamais choisi (INV-1).
argos.preferences.profils-par-defaut=developpeur

# --- Profil de veille « artiste » (ajouter-profil-artiste, ADR-0024) -----------
# Sources (Q-1) : jeux de données de data.culture.gouv.fr (Licence Ouverte Etalab, API Opendatasoft
# « explore v2.1 ») et flux RSS publics d'organismes, lus par le collecteur de la veille web. Une
# source n'est collectée qu'après l'enregistrement de ses conditions d'usage (ART-05).
# Hôtes admis pour une source de type DATA_CULTURE.
argos.profil-artiste.data-culture.hotes=data.culture.gouv.fr
%test.argos.profil-artiste.data-culture.hotes=data.culture.gouv.fr,localhost
# Champs lus dans chaque enregistrement d'un jeu de données (correspondance à confirmer par jeu).
argos.profil-artiste.data-culture.champ.identifiant=identifiant
argos.profil-artiste.data-culture.champ.titre=titre
argos.profil-artiste.data-culture.champ.organisme=organisme
argos.profil-artiste.data-culture.champ.criteres=criteres
argos.profil-artiste.data-culture.champ.lien=lien
argos.profil-artiste.data-culture.champ.discipline=discipline
argos.profil-artiste.data-culture.champ.territoire=region
argos.profil-artiste.data-culture.champ.date-limite=date_limite
# Enregistrements ou éléments de flux retenus par collecte et par source.
argos.profil-artiste.elements-max=500
# Collecte quotidienne (05:00) et rappels de date limite (07:00), fuseau argos.alerting.fuseau.
argos.profil-artiste.collecte.cron=${ARGOS_ARTISTE_COLLECTE_CRON:0 0 5 * * ?}
argos.profil-artiste.rappels.cron=${ARGOS_ARTISTE_RAPPELS_CRON:0 0 7 * * ?}
# Rappels par défaut avant une date limite : J-30, J-7 et J-1 (Q-4), réglables par chaque utilisateur.
argos.profil-artiste.rappels-jours=30,7,1
# Collectes à la demande (récupération externe) : 10 par minute et par compte.
argos.profil-artiste.debit.requetes-par-minute=10
%test.argos.profil-artiste.debit.requetes-par-minute=100000

# --- Débits de la recherche et de « Ma veille » (RCH-06, PRF-08) -----------------------------
# Requêtes par minute et par compte : un compteur commun à GET /api/v1/recherche et à
# GET /api/v1/vues/{id}/resultats, un compteur distinct pour GET /api/v1/me/veille.
argos.recherche.debit.requetes-par-minute=60
%test.argos.recherche.debit.requetes-par-minute=100000
argos.veille.debit.requetes-par-minute=60
%test.argos.veille.debit.requetes-par-minute=100000

# --- Veille réglementaire (suivre-veille-reglementaire, ADR-0018 ; ADR-0030 proposé) ---------
# Source principale (Q-1) : jeux de données JORF de la DILA, Licence Ouverte / Open Licence (réutilisation
# gratuite, mention de la source). L'API PISTE de Légifrance n'est pas utilisée. Archives quotidiennes
# JORF_AAAAMMJJ-HHMMSS.tar.gz lues sans redirection, avec délai et tailles bornés.
argos.reglementaire.jorf.url=${ARGOS_JORF_URL:https://echanges.dila.gouv.fr/OPENDATA/JORF}
argos.reglementaire.jorf.delai=PT60S
argos.reglementaire.jorf.taille-max-octets=52428800
argos.reglementaire.jorf.entrees-max=50000
argos.reglementaire.jorf.decompresse-max-octets=524288000
# Liens vers le texte publié et sa version consolidée.
argos.reglementaire.legifrance.url=https://www.legifrance.gouv.fr
# Collecte quotidienne (06:30) et rappels (07:15), fuseau argos.alerting.fuseau. Chaque collecte relit les
# 3 derniers jours, jour courant compris (archives publiées après son passage, seules les archives non lues
# sont téléchargées) ; jours manqués repris au plus 31 jours en arrière ; jour abandonné après 5 échecs
# consécutifs de ses archives (rejouable par l'administrateur plateforme).
argos.reglementaire.collecte.cron=${ARGOS_REGLEMENTAIRE_COLLECTE_CRON:0 30 6 * * ?}
argos.reglementaire.rappels.cron=${ARGOS_REGLEMENTAIRE_RAPPELS_CRON:0 15 7 * * ?}
argos.reglementaire.relecture-jours=3
argos.reglementaire.reprise-jours-max=31
argos.reglementaire.tentatives-max=5
# Rappels avant une entrée en vigueur : J-90, J-30 et J-7 (Q-2), réglables par espace. Un rappel que la
# tâche n'a pas pu envoyer le jour exact part encore dans les 3 jours suivants.
argos.reglementaire.rappels-jours=90,30,7
argos.reglementaire.rappels.rattrapage-jours=3
# Proposition d'un domaine par l'IA pour un texte qu'aucune règle ne rattache : natures de texte
# concernées et nombre maximal de propositions par espace et par collecte (charge du modèle local).
argos.reglementaire.ia.natures=LOI,ORDONNANCE,DECRET,ARRETE
argos.reglementaire.ia.propositions-max=20
# Requêtes déclenchant un appel externe (collecte à la demande, demande d'évolution) : 10 par minute et par compte.
argos.reglementaire.debit.requetes-par-minute=10
%test.argos.reglementaire.debit.requetes-par-minute=100000

# --- CORS : IHM Vite en développement et client desktop Electron (ADR-0022) --
# Le desktop sert l'IHM depuis son protocole interne app://argos.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=app://argos
%dev.quarkus.http.cors.origins=http://localhost:5173,app://argos
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# --- Authentification OIDC (ACC-01, ADR-0008, ADR-0027) ------------------------
# Fournisseur d'identité : Keycloak auto-hébergé (Q-1). L'API valide les jetons
# porteurs (signature, émetteur, audience, expiration) ; l'IHM et le client desktop
# obtiennent les jetons par Authorization Code + PKCE.
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${ARGOS_OIDC_CLIENT_ID:argos-server}
quarkus.oidc.token.audience=${ARGOS_OIDC_AUDIENCE:argos-server}
%prod.quarkus.oidc.auth-server-url=${ARGOS_OIDC_URL}
# Développement et tests : Quarkus Dev Services démarre un Keycloak jetable (Docker requis).
# Royaume argos de test (src/test/resources/keycloak/argos-realm.json) : chemin du
# classpath en test, chemin de fichier en développement.
%test.quarkus.keycloak.devservices.realm-path=keycloak/argos-realm.json
%test.quarkus.keycloak.devservices.realm-name=argos
%test.quarkus.oidc.credentials.secret=secret-de-test
%dev.quarkus.keycloak.devservices.realm-path=src/test/resources/keycloak/argos-realm.json
%dev.quarkus.keycloak.devservices.realm-name=argos
%dev.quarkus.oidc.credentials.secret=secret-de-test
# Port fixe en développement : l'IHM (VITE_ARGOS_OIDC_ISSUER) et le client desktop (ARGOS_OIDC_URL)
# visent par défaut http://localhost:8180/realms/argos (changement connecter-ihm-oidc).
%dev.quarkus.keycloak.devservices.port=8180

# Émetteur et client OIDC de l'IHM servie (ACC-11) : l'IHM les lit dans la réponse publique de
# GET /api/v1/system/info avant d'ouvrir sa session, et la politique de sécurité du contenu (ACC-12) nomme
# l'origine de cet émetteur. L'émetteur public est l'adresse que joint le navigateur et que portent les
# jetons ; il diffère de ARGOS_OIDC_URL quand le serveur joint le fournisseur par une adresse interne
# (profil idp-local). Sans ARGOS_OIDC_ISSUER_PUBLIC, c'est ARGOS_OIDC_URL.
%prod.argos.ui.oidc.emetteur=${ARGOS_OIDC_ISSUER_PUBLIC:${ARGOS_OIDC_URL}}
%dev.argos.ui.oidc.emetteur=http://localhost:8180/realms/argos
%test.argos.ui.oidc.emetteur=http://idp.test:8443/realms/argos
argos.ui.oidc.client-id=argos-ui

# Toutes les routes exigent une session, sauf l'état de santé, l'identité du serveur et les fichiers
# statiques de l'IHM (page, ressources, avis de licence des polices) : la page doit se charger pour que
# l'utilisateur puisse ouvrir sa session OIDC ; toutes les données passent par l'API, protégée.
quarkus.http.auth.permission.public.paths=/api/v1/system/info,/q/health,/q/health/*,/,/index.html,/assets/*,/licences-polices.txt
quarkus.http.auth.permission.public.policy=permit
# Métriques d'exploitation (EXP-14-S2, ADR-0036) : réservées à l'administrateur plateforme (décision Q-1 du porteur
# du projet, 2026-11-24) ; la politique admin-plateforme relit le compte Argos du jeton.
quarkus.http.auth.permission.metriques.paths=/q/metrics,/q/metrics/*
quarkus.http.auth.permission.metriques.policy=admin-plateforme
quarkus.http.auth.permission.authentifie.paths=/*
quarkus.http.auth.permission.authentifie.policy=authenticated

# --- Comptes et accès (ACC-02, ACC-05) -------------------------------------------
# Inscription sur invitation (Q-2) ; « ouverte » crée le compte de toute personne authentifiée.
argos.comptes.inscription=invitation
# Profil de veille activé à la création d'un compte (Q-3, PRF-01).
argos.comptes.profil-par-defaut=developpeur
# E-mail vérifié de l'administrateur plateforme créé sans invitation à sa première connexion.
argos.comptes.admin-plateforme-initial=${ARGOS_ADMIN_EMAIL:}
%test.argos.comptes.admin-plateforme-initial=alice@argos.test
%dev.argos.comptes.admin-plateforme-initial=alice@argos.test
argos.invitations.validite-jours=14

# --- Serveur MCP en lecture seule (ADR-0014, changement exposer-serveur-mcp) ----
# Transport Streamable HTTP sur POST /mcp. En protocole 2026-07-28 (sans état), aucune session n'est
# créée ; l'extension accepte aussi les versions antérieures, dont la négociation par initialize ouvre
# une session en mémoire (écart consigné dans la fiche serveur-mcp) : ces négociations sont limitées
# par ControleInitialisation et une session inactive est fermée au bout de 30 minutes. Chaque requête
# reste authentifiée par son jeton, session présentée ou non. L'authentification est celle de l'API
# (jeton OIDC Keycloak, règle « authentifie » ci-dessus) ; les IDE obtiennent leur jeton par le flux d'appareil OAuth 2.0
# (RFC 8628) du client Keycloak argos-mcp (Q-3). Argos ne stocke aucun jeton personnel.
quarkus.mcp.server.server-info.name=argos
quarkus.mcp.server.http.root-path=/mcp
quarkus.mcp.server.connection-idle-timeout=30M
# Résultat structuré aussi renvoyé sérialisé dans un bloc texte « content », pour les clients qui ne
# lisent que ce champ (CallToolResult de la spécification MCP 2025-06-18).
quarkus.mcp.server.tools.structured-content.compatibility-mode=true
# 60 requêtes par minute et par utilisateur (Q-1) ; texte externe tronqué à 2 000 caractères (Q-2).
argos.mcp.debit.requetes-par-minute=60
argos.mcp.contenu-externe.longueur-max=2000
# Tests : limite relevée pour que les suites partagent les comptes de test ; la limite elle-même
# est vérifiée par un profil de test dédié.
%test.argos.mcp.debit.requetes-par-minute=100000
