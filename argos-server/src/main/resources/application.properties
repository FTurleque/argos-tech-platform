# ---------------------------------------------------------------------------
# ARGOS — configuration du serveur
# Les secrets ne sont jamais versionnés : ils viennent de variables d'environnement.
# ---------------------------------------------------------------------------
quarkus.application.name=argos-server

# --- Base de données (ADR-0002) ---------------------------------------------
quarkus.datasource.db-kind=postgresql
# Production / VM : tout vient de l'environnement.
%prod.quarkus.datasource.jdbc.url=${ARGOS_DB_URL}
%prod.quarkus.datasource.username=${ARGOS_DB_USER}
%prod.quarkus.datasource.password=${ARGOS_DB_PASSWORD}
# Développement : la base PostgreSQL de compose.yaml (docker compose up -d postgres).
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/argos
%dev.quarkus.datasource.username=argos
%dev.quarkus.datasource.password=argos
# Tests : Quarkus Dev Services démarre un PostgreSQL jetable (Docker requis).

# --- Migrations (Flyway : choix provisoire, ADR à rédiger, arc42 §9.3 point 3) ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# --- API --------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=ARGOS API
quarkus.smallrye-openapi.info-version=v1
quarkus.swagger-ui.always-include=false

# --- CORS : IHM Vite en développement et client desktop Electron (ADR-0022) --
# Le desktop sert l'IHM depuis son protocole interne app://argos.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=app://argos
%dev.quarkus.http.cors.origins=http://localhost:5173,app://argos
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# --- Authentification OIDC (ACC-01, ADR-0008, ADR-0027) ------------------------
# Fournisseur d'identité : Keycloak auto-hébergé (Q-1). L'API valide les jetons
# porteurs (signature, émetteur, audience, expiration) ; l'IHM et le client desktop
# obtiennent les jetons par Authorization Code + PKCE.
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${ARGOS_OIDC_CLIENT_ID:argos-server}
quarkus.oidc.token.audience=${ARGOS_OIDC_AUDIENCE:argos-server}
%prod.quarkus.oidc.auth-server-url=${ARGOS_OIDC_URL}
# Développement et tests : Quarkus Dev Services démarre un Keycloak jetable (Docker requis).
# Royaume argos de test (src/test/resources/keycloak/argos-realm.json) : chemin du
# classpath en test, chemin de fichier en développement.
%test.quarkus.keycloak.devservices.realm-path=keycloak/argos-realm.json
%test.quarkus.keycloak.devservices.realm-name=argos
%test.quarkus.oidc.credentials.secret=secret-de-test
%dev.quarkus.keycloak.devservices.realm-path=src/test/resources/keycloak/argos-realm.json
%dev.quarkus.keycloak.devservices.realm-name=argos
%dev.quarkus.oidc.credentials.secret=secret-de-test

# Toutes les routes exigent une session, sauf l'état de santé et l'identité du serveur.
quarkus.http.auth.permission.public.paths=/api/v1/system/info,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authentifie.paths=/*
quarkus.http.auth.permission.authentifie.policy=authenticated

# --- Comptes et accès (ACC-02, ACC-05) -------------------------------------------
# Inscription sur invitation (Q-2) ; « ouverte » crée le compte de toute personne authentifiée.
argos.comptes.inscription=invitation
# Profil de veille activé à la création d'un compte (Q-3, PRF-01).
argos.comptes.profil-par-defaut=developpeur
# E-mail vérifié de l'administrateur plateforme créé sans invitation à sa première connexion.
argos.comptes.admin-plateforme-initial=${ARGOS_ADMIN_EMAIL:}
%test.argos.comptes.admin-plateforme-initial=alice@argos.test
%dev.argos.comptes.admin-plateforme-initial=alice@argos.test
argos.invitations.validite-jours=14
